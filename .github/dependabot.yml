# Dependency updates, opened as pull requests.
#
# Every one of these goes through the same workflow as any other change —
# lint, typecheck, the suite under coverage thresholds, and a Docker build —
# so an update that breaks something turns the pull request red rather than
# reaching main. Nothing here merges on its own.
#
# Weekly rather than daily: this is a small project, and a daily cadence turns
# into a queue of pull requests nobody reads, which is the same as no updates
# at all but noisier.
version: 2
updates:
  # npm. Grouped so that a week's worth of patch and minor bumps arrives as
  # one pull request with one CI run, and only majors — the ones that need a
  # changelog read — come separately.
  #
  # `typescript` is held back deliberately: see "A note on the TypeScript
  # version" in README.md. typescript-eslint declares
  # `typescript: ">=4.8.4 <6.1.0"`, so the ceiling is 6.1 rather than 7 — and
  # above it `npm run lint`, and therefore every build, fails outright.
  #
  # Minor as well as major, because 6.1 *is* a minor: ignoring only majors let
  # Dependabot raise the one bump that breaks linting, grouped in with a
  # week's worth of harmless ones. package.json pins the range itself
  # (">=6.0.3 <6.1.0") so an `npm install` cannot do it either; this only
  # keeps the pull request from being opened. Patches still come through,
  # which is the whole point of not pinning an exact version.
  #
  # Widen both once typescript-eslint's peer range does.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # GitHub Actions. superfly/flyctl-actions/setup-flyctl is pinned to a commit
  # SHA on purpose (the reasoning is in fly-deploy.yml, next to the pin);
  # Dependabot understands SHA pins and will raise the move as a pull request
  # with the diff attached, which is exactly the "read what changed, then move
  # the SHA" this wants.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # No Docker entry, on purpose. There used to be one, and it did nothing:
  # dependabot-core's Dockerfile parser only turns a FROM line into a
  # dependency when the line carries a literal tag or digest, and this
  # Dockerfile has neither. `FROM node:${NODE_VERSION}-slim` takes its tag
  # from an ARG — deliberately, since the Node major is written in four files
  # that tests/node-version.test.ts holds together — and the other two stages
  # are `FROM base`. Both are skipped as having no version, so the weekly job
  # found nothing to update, and the plan in the Dockerfile's header of
  # letting this "move a digest for us" could never have worked. The base
  # image stays current by being a moving tag instead (see that header), and
  # the major moves by hand, in all four places at once.
