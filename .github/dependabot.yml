# Dependency updates, opened as pull requests.
#
# Every one of these goes through the same workflow as any other change —
# lint, typecheck, the suite under coverage thresholds, and a Docker build —
# so an update that breaks something turns the pull request red rather than
# reaching main. Nothing here merges on its own.
#
# Weekly rather than daily: this is a small project, and a daily cadence turns
# into a queue of pull requests nobody reads, which is the same as no updates
# at all but noisier.
version: 2
updates:
  # npm. Grouped so that a week's worth of patch and minor bumps arrives as
  # one pull request with one CI run, and only majors — the ones that need a
  # changelog read — come separately.
  #
  # `typescript` is not the compiler: see "A note on the TypeScript version"
  # in README.md. The compiler is `@typescript/native` (an alias of
  # typescript@7, which `npm run typecheck` runs) and takes every update.
  # `typescript` is an alias of @typescript/typescript6, the TypeScript 6 API
  # that typescript-eslint imports under that name. It declares
  # `typescript: ">=4.8.4 <6.1.0"`, and above that `npm run lint`, and
  # therefore every build, fails outright.
  #
  # Minor as well as major, because 6.1 *is* a minor: ignoring only majors let
  # Dependabot raise the one bump that breaks linting, grouped in with a
  # week's worth of harmless ones. The "overrides" entry in package.json holds
  # the shim's own copy below 6.1, so an `npm install` cannot do it either;
  # this only keeps the pull request from being opened. Patches still come
  # through.
  #
  # Drop this, the shim and the override once typescript-eslint can use
  # TypeScript 7.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # Majors only, and for a different reason: @types/node's major is the
      # Node major it describes, and production runs the one in .nvmrc. With
      # nothing compiled, typecheck is the only thing that would catch a call
      # to an API the runtime does not have. It is on 26 ahead of a Node 24
      # runtime, raised by hand on purpose, and README.md ("A note on
      # @types/node") says what that costs. A major stays a decision made by
      # hand rather than a weekly pull request: it should move with the four
      # places the Node version is written (see tests/node-version.test.ts),
      # not ahead of them by default.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # Every update. js-dos is the emulator the app serves from node_modules
      # (see JS_DOS_PATH in app.ts), and its release is written in four more
      # places than package.json — the address and integrity hashes in
      # public/js-dos.html and JS_DOS_VERSION in app.ts and the player script —
      # which Dependabot cannot edit. Its pull request could only ever be red,
      # and inside the minor-and-patch group it would hold back every other
      # bump in the week with it. Raised by hand; tests/public-assets.test.ts
      # says what is left to change.
      - dependency-name: js-dos

  # GitHub Actions. superfly/flyctl-actions/setup-flyctl is pinned to a commit
  # SHA on purpose (the reasoning is in fly-deploy.yml, next to the pin);
  # Dependabot understands SHA pins and will raise the move as a pull request
  # with the diff attached, which is exactly the "read what changed, then move
  # the SHA" this wants.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # No Docker entry, on purpose. There used to be one, and it did nothing:
  # dependabot-core's Dockerfile parser only turns a FROM line into a
  # dependency when the line carries a literal tag or digest, and this
  # Dockerfile has neither. `FROM node:${NODE_VERSION}-slim` takes its tag
  # from an ARG — deliberately, since the Node major is written in four files
  # that tests/node-version.test.ts holds together — and the other two stages
  # are `FROM base`. Both are skipped as having no version, so the weekly job
  # found nothing to update, and the plan in the Dockerfile's header of
  # letting this "move a digest for us" could never have worked. The base
  # image stays current by being a moving tag instead (see that header), and
  # the major moves by hand, in all four places at once.
