<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- The frame carries its own title on the game page; this is for the
         document opened on its own, which is a public address. -->
    <title>Game player - OldSchoolGames</title>
    <!--
      js-dos, pinned to one release and checked against its hash.

      Both of these used to be "https://v8.js-dos.com/latest/…". That is a
      moving target with full script privileges in this origin: whatever the
      vendor publishes there next runs as this site, with access to its DOM
      and its cookies, and nothing here would notice the change. Their CDN
      publishes no versioned path — only /latest/ — so there was nothing to
      pin to and no fixed bytes to write an integrity hash against.

      The same release is on npm, and it was served from jsDelivr next. That
      pinned these two files, which can carry a hash, but not the ones js-dos
      fetches for itself — emulators.js, wdosbox.js and the wasm — which can
      not, and which ran as this site on nothing but the CDN's word.

      So the release is a dependency of this app now ("js-dos" in
      package.json), and app.ts serves its dist/ directory at /vendor/js-dos/
      <version>/: the bytes are the ones the lockfile's sha512 names, every
      one of them, and no third party is in the path. They are the same bytes
      jsDelivr served, because jsDelivr serves the npm tarball, so the switch
      changed no behaviour on the day it was made. The hashes below are kept:
      they now hold this file and the installed package to the same release,
      and tests/public-assets.test.ts checks them against node_modules.

      Raising the version is deliberate work — package.json, a new hash here,
      both addresses below, JS_DOS_VERSION in app.ts and in
      public/js/js-dos-player.js, which names the emulator runtime and must
      name the same release. The suite fails until they agree.
    -->
    <link
      rel="stylesheet"
      href="/vendor/js-dos/8.4.1/js-dos.css"
      integrity="sha384-tYrgAxbRPufJUrIUwrHMumsQ0yWXdNaYMGKazEkzSgtkpSAps5dIS71lqDFtoVNF"
    />
    <script
      src="/vendor/js-dos/8.4.1/js-dos.js"
      integrity="sha384-uYvVxxF95v52Wy2Cep+7dZZn2dzU6IAdVyDhfMGEsS8Mi3LfnZYPXSHa2QBB4d5+"
    ></script>
    <link rel="stylesheet" href="/css/js-dos-player.css" />
  </head>
  <body>
    <div id="dos" style="width: 100vw; height: 100vh">
      <!-- SVG filter lives inside #dos so it survives fullscreen -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        style="position: absolute; width: 0; height: 0; overflow: hidden"
        aria-hidden="true"
      >
        <defs>
          <filter
            id="crt-phosphor"
            x="0%"
            y="0%"
            width="100%"
            height="100%"
            color-interpolation-filters="sRGB"
          >
            <!-- Phosphor tint only – no glow, no brightening -->
            <!-- Slightly warm white point, pull blue down, keep R+G ≤ 1 -->
            <feColorMatrix
              in="SourceGraphic"
              type="matrix"
              values="1.02 0.01 0.00 0  0.00
                      0.00 1.02 0.01 0  0.00
                      0.00 0.00 0.95 0  0.00
                      0.00 0.00 0.00 1  0.00"
            />
          </filter>
        </defs>
      </svg>

      <!-- CRT overlay layers (all inside #dos → work in fullscreen) -->
      <div id="crt-scanlines"></div>
      <div id="crt-vignette"></div>
      <div id="crt-matrix"></div>

      <!-- Toggle button (inside #dos → visible in fullscreen)

           Shipped reading "ON", because that is what the player does: crtOn in
           public/js/js-dos-player.js is `readStored("osg-crt") !== "0"`, so a
           visitor who has never touched the toggle gets the filter. The markup
           said "OFF" and the script corrected it on load, which is one frame of
           a wrong label for everyone — and the whole label for anyone whose
           script is blocked or has not arrived yet, with the scanlines already
           drawn by the stylesheet. aria-pressed is here for the same reason and
           kept in step by setCRT; tests/public-assets.test.ts holds the two
           together. -->
      <button id="crt-btn" title="Toggle CRT filter (Alt+F7)" aria-pressed="true">CRT: ON</button>
    </div>

    <!-- External, not inline: the Content-Security-Policy allows inline script
         only by nonce, and a static file cannot carry one. See
         public/js/js-dos-player.js.

         The "?retired-v8" is not a version to keep bumping — app.ts serves
         this script "no-cache", so an edit to it reaches a browser on the
         next request. It is here to walk away from one particular set of
         stored copies: the ones a browser kept for a day before that header
         existed, whose pathPrefix still names v8.js-dos.com. Such a copy
         paired with a current frame asks for a host this policy no longer
         allows, and the emulator is refused with nothing but a console
         message to show for it — the same failure as a stale frame, from
         the other side. A new address is the only thing those copies
         answer to. -->
    <script src="/js/js-dos-player.js?retired-v8"></script>
  </body>
</html>
